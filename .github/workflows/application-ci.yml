name: Application CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runner placement
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -d /home/www10177/1.services
          test -z "${KOMODO_API_KEY:-}${KOMODO_API_SECRET:-}${REGISTRY_TOKEN:-}"
      - name: Build frontend
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          npm ci --no-audit --no-fund
          bun run build
