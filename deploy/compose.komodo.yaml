name: via

services:
  via:
    image: via:main
    pull_policy: build
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: via
    restart: always
    networks: [traefik-net]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.via.rule=Host(`via.ristw.dev`)"
      - "traefik.http.routers.via.entrypoints=websecure"
      - "traefik.http.routers.via.tls=true"
      - "traefik.http.services.via.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
